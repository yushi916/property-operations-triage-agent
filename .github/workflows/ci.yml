name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Base scenario
        run: python -m evals.run_demo --scenario base
      - name: Active notice scenario
        run: python -m evals.run_demo --scenario active_notice
      - name: Replay recorded runs
        run: python -m evals.replay_recorded
