name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    name: Offline / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency declarations
        run: python -m pip check
      - name: Record tested runtime and packages
        run: |
          python -c "import platform, sys; print(sys.version); print(platform.platform())"
          python -m pip list --format=freeze
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Base scenario
        run: python -m evals.run_demo --scenario base
      - name: Active notice scenario
        run: python -m evals.run_demo --scenario active_notice
      - name: Replay recorded runs
        run: python -m evals.replay_recorded
